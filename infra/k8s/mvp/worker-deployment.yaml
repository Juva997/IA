apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistente-worker
  labels:
    app: assistente-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assistente-worker
  template:
    metadata:
      labels:
        app: assistente-worker
    spec:
      containers:
        - name: rq-worker
          image: assistente_local:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "service.rq_worker"]
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: assistente-worker
spec:
  selector:
    app: assistente-worker
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

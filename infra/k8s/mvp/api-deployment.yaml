apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistente-api
  labels:
    app: assistente-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: assistente-api
      version: stable
  template:
    metadata:
      labels:
        app: assistente-api
        version: stable
    spec:
      containers:
        - name: api
          image: assistente_local:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ASSISTENTE_REQUIRE_API_KEY
              value: "0" # set to "1" in production and provide secret
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: assistente-api
spec:
  selector:
    app: assistente-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assistente-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assistente-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

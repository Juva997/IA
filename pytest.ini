[pytest]
addopts = -q -p no:cacheprovider --strict-markers -m "not llm and not slow"
testpaths =
    tests/unit
    tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast deterministic unit tests
    integration: deterministic tests that exercise multiple local components
    llm: optional tests that exercise LLM-facing behavior and require explicit opt-in
    slow: optional long-running tests
    e2e_optional: optional end-to-end tests that run only when explicitly selected
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: |
          python -m ruff check .

      - name: Type-check with mypy
        run: |
          python -m mypy --config-file mypy.ini .

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report -m --fail-under=65

      - name: Smoke benchmark CLI (offline)
        run: |
          python -m benchmark.runner --list-datasets
          python -m benchmark.runner --dataset reasoning --runs 1 --quiet --allow-failures --json "${{ runner.temp }}/benchmark-smoke-ci.json"
